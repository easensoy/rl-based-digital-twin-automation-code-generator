[pytest]
testpaths = tests
addopts = --strict-markers
markers =
    training: starts DQN training; excluded from the portable verification run
    service: launches the server application in a separate process; excluded from the portable verification run
    vendor: needs EAE Buildtime (FBTypeCompiler.exe); skipped when it is not installed
    platform_reference: compares with float32 bits recorded on the reference machine; skips if this PyTorch build rounds differently
